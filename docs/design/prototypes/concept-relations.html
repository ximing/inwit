<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inwit · 概念与关系 M0</title><link rel="stylesheet" href="concept-relations-m0/style.css"></head>
<body><header><div class="brand">Inwit <span>纸上学习 / 任务原型 M0</span></div><div class="row"><button data-action="variant" data-value="A">A · 双视图</button><button data-action="variant" data-value="B">B · 局部联系</button><button data-action="generate">模拟 Agent 生成</button><button data-action="candidates">查看候选</button></div></header>
<div class="notice">原型示例数据 · 非真实文献或用户资料。无模型、无后端；编辑与 A/B 独立视图仅存本标签 sessionStorage，刷新可恢复，关闭标签不承诺保留。<span id="storage-warning"></span></div>
<nav class="row" aria-label="布局"><button data-action="mode" data-value="outline">专注脑图</button><button data-action="mode" data-value="concepts">专注概念</button><button data-action="mode" data-value="compare">双视图对照</button><button data-action="arrange">切换双图排列</button><button data-action="return">返回定位前状态</button><button data-action="unmax">返回原布局</button><span id="layout-label"></span></nav>
<main id="workspace"><section id="article-panel" class="panel"><div class="panel-head"><strong>怎样读懂一次 Agent 测评</strong><button data-action="max" data-value="article">放大正文</button></div><div id="article" class="scroll"></div></section><div id="read-split" class="split" role="separator" tabindex="0" aria-label="调整正文宽度" aria-orientation="vertical"></div><div id="learning"><section id="outline-panel" class="panel"><div class="panel-head"><strong>文章脑图</strong><button data-action="max" data-value="outline">临时放大</button></div><div id="outline-tools" class="row tools"></div><div id="outline-map" class="canvas" tabindex="0" aria-label="文章脑图画布；方向键平移"></div><div id="outline-detail" class="scroll detail"></div></section><div id="graph-split" class="split" role="separator" tabindex="0" aria-label="调整两图比例"></div><section id="concept-panel" class="panel"><div class="panel-head"><strong id="concept-title">概念与关系</strong><button data-action="close-local">收起局部联系</button><button data-action="max" data-value="concepts">临时放大</button></div><div class="row tools"><input id="search" aria-label="搜索概念" placeholder="搜索名称或中文"><select id="filter" aria-label="概念过滤"><option value="all">本文全部</option><option value="review">已练习</option><option value="new">新收录</option></select><button data-action="graphmode">图 / 列表</button><div id="concept-tools"></div></div><div id="concept-map" class="canvas" tabindex="0" aria-label="概念图画布；方向键平移"></div><div id="concept-list" class="scroll"></div><div id="concept-detail" class="scroll detail"></div></section></div></main>
<footer><span id="status" role="status">选中只联动高亮；点击「定位」才移动或展开。</span><details><summary>走查工具</summary><button data-action="change-source">模拟正文变化 / 恢复</button><button data-action="delete-target">模拟删除当前概念</button><button data-action="restore-target">恢复示例概念</button></details></footer>
<dialog id="modal" aria-label="原型任务"><div id="modal-content"></div><button data-action="close-modal">返回工作区（保留草稿）</button></dialog>
<script src="concept-relations-m0/data.js"></script><script src="concept-relations-m0/app.js"></script></body></html>
