<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-labelledby="title desc">
  <title id="title">AI First 的两条路径</title>
  <desc id="desc">对内 Inwit Agent 从资料与反馈走到卡片、地图和周报；对外其他 Agent 经 skill 与令牌调用同一套 API，汇入同一份数据。</desc>

  <rect width="880" height="392" rx="20" fill="#1C1915"/>
  <rect x=".5" y=".5" width="879" height="391" rx="20" fill="none" stroke="#3F372C"/>

  <rect x="24" y="22" width="3" height="16" rx="1.5" fill="#E06A52"/>
  <rect x="448" y="22" width="3" height="16" rx="1.5" fill="#E06A52"/>

  <text x="36" y="35" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif" font-size="11" font-weight="650" letter-spacing="1.4" fill="#E06A52">对内 · INWIT AGENT</text>
  <line x1="188" y1="32" x2="424" y2="32" stroke="#3F372C" stroke-width="1"/>
  <text x="460" y="35" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif" font-size="11" font-weight="650" letter-spacing="1.4" fill="#E06A52">对外 · 其他 AGENT</text>
  <line x1="596" y1="32" x2="848" y2="32" stroke="#3F372C" stroke-width="1"/>

  <g font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif">
    <rect x="24" y="52" width="400" height="52" rx="10" fill="#26221C" stroke="#3F372C"/>
    <text x="224" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#F0E8D8">资料 / 问号 / 复习反馈</text>
    <text x="224" y="92" text-anchor="middle" font-size="12" fill="#C9BFAE">观察你扔进来的和忘在哪里</text>
    <line x1="224" y1="104" x2="224" y2="120" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M219 116 L224 123 L229 116" fill="none" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="124" width="400" height="52" rx="10" fill="#26221C" stroke="#3F372C"/>
    <text x="224" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#F0E8D8">worker 调度</text>
    <text x="224" y="164" text-anchor="middle" font-size="12" fill="#C9BFAE">队列在 PostgreSQL · 领取 / 超时回收 / 重试</text>
    <line x1="224" y1="176" x2="224" y2="192" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M219 188 L224 195 L229 188" fill="none" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="196" width="400" height="78" rx="10" fill="#26221C" stroke="#3F372C"/>
    <text x="224" y="216" text-anchor="middle" font-size="12" fill="#6E6558">消化 · 问答 · 地图 · 进化 · 周报</text>
    <rect x="52" y="228" width="88" height="28" rx="14" fill="#3A2420"/>
    <text x="96" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="#E06A52">切卡</text>
    <text x="154" y="247" text-anchor="middle" font-size="14" fill="#E06A52">→</text>
    <rect x="168" y="228" width="88" height="28" rx="14" fill="#E06A52"/>
    <text x="212" y="247" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1915">你复习</text>
    <text x="270" y="247" text-anchor="middle" font-size="14" fill="#E06A52">→</text>
    <rect x="284" y="228" width="88" height="28" rx="14" fill="#3A2420"/>
    <text x="328" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="#E06A52">进化</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif">
    <rect x="456" y="52" width="400" height="52" rx="10" fill="#26221C" stroke="#3F372C"/>
    <text x="656" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#F0E8D8">Claude · Codex · 其他 Agent</text>
    <text x="656" y="92" text-anchor="middle" font-size="12" fill="#C9BFAE">把对话里的碎片送进同一份学习数据</text>
    <line x1="656" y1="104" x2="656" y2="120" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M651 116 L656 123 L661 116" fill="none" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="456" y="124" width="400" height="52" rx="10" fill="#26221C" stroke="#3F372C"/>
    <text x="656" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#F0E8D8">skills/inwit</text>
    <text x="656" y="164" text-anchor="middle" font-size="12" fill="#C9BFAE">iwt_ 个人访问令牌</text>
    <line x1="656" y1="176" x2="656" y2="192" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M651 188 L656 195 L661 188" fill="none" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="456" y="196" width="400" height="78" rx="10" fill="#26221C" stroke="#3F372C"/>
    <text x="656" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#F0E8D8">/api</text>
    <text x="656" y="252" text-anchor="middle" font-size="12" fill="#C9BFAE">同一套 HTTP API，不是另一套卡片</text>
  </g>

  <path d="M224 274 L224 304 L428 304" fill="none" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M656 274 L656 304 L452 304" fill="none" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="440" y1="304" x2="440" y2="322" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M435 318 L440 325 L445 318" fill="none" stroke="#E06A52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="200" y="328" width="480" height="44" rx="10" fill="#26221C" stroke="#3F372C"/>
  <rect x="200" y="328" width="4" height="44" rx="2" fill="#E06A52"/>
  <text x="440" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif" font-size="12" font-weight="650" fill="#E06A52">同一份数据</text>
  <text x="440" y="364" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif" font-size="12" fill="#C9BFAE">documents · cards · topics</text>
</svg>
